services:
  db:
    image: postgres:15-alpine
    container_name: brevly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brevly"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: brevly-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/brevly
    ports:
      - "3333:3333"

volumes:
  db-data: