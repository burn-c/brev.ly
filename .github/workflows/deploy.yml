name: Deploy (manual)

# Deploy sob demanda: NÃO dispara em push para main.
# Use "Run workflow" no GitHub Actions e digite a confirmação.
# Guard opcional: defina a variable BREVLY_DEPLOY_ENABLED=false para bloquear
# qualquer deploy (inclusive manual) enquanto a infra estiver derrubada.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "deploy-brevly-prod" para confirmar'
        required: true
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: brevly-server
  S3_BUCKET: brevly-frontend-web

jobs:
  guard:
    name: Confirm manual deploy
    runs-on: ubuntu-latest
    if: vars.BREVLY_DEPLOY_ENABLED != 'false'
    permissions:
      contents: read
    steps:
      - name: Validate ref and confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy de produção só pode ser disparado a partir de main."
            exit 1
          fi
          if [ "$CONFIRM" != "deploy-brevly-prod" ]; then
            echo "::error::Confirmação inválida. Digite deploy-brevly-prod."
            exit 1
          fi
          echo "Deploy confirmado."

  build-and-push-server:
    name: Build & push server image (ECR)
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check ECR repository exists
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Repositório ECR $ECR_REPOSITORY não existe. Após um teardown, rode 'pulumi up -s brevly-prod' em infra/ antes do deploy."
            exit 1
          fi

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: meta
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" server/
          docker tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  pulumi-deploy:
    name: Pulumi up (brevly-prod)
    runs-on: ubuntu-latest
    needs: build-and-push-server
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Set stack config
        working-directory: infra
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          AWS_REGION=us-east-1 pulumi login s3://brevly-pulumi-state
          AWS_REGION=us-east-1 PULUMI_CONFIG_PASSPHRASE="" pulumi stack select brevly-prod
          AWS_REGION=us-east-1 PULUMI_CONFIG_PASSPHRASE="" pulumi config set brevly-infra:imageTag latest
          AWS_REGION=us-east-1 PULUMI_CONFIG_PASSPHRASE="" pulumi config set brevly-infra:enableTls "${{ vars.BREVLY_ENABLE_TLS || 'false' }}"
          AWS_REGION=us-east-1 PULUMI_CONFIG_PASSPHRASE="" pulumi config set brevly-infra:accountId 488182246611
          AWS_REGION=us-east-1 PULUMI_CONFIG_PASSPHRASE="" pulumi config set --secret brevly-infra:dbPassword "$DB_PASSWORD"

      - name: Pulumi up
        working-directory: infra
        env:
          AWS_REGION: us-east-1
          PULUMI_CONFIG_PASSPHRASE: ""
        run: pulumi up -s brevly-prod --yes

      - name: Force ECS redeploy (re-pull latest image)
        run: |
          aws ecs update-service --region us-east-1 --cluster brevly-cluster --service brevly-server-api --force-new-deployment

  migrate:
    name: Run db:migrate (ECS task)
    runs-on: ubuntu-latest
    needs: pulumi-deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get database endpoint, subnets and task definition
        working-directory: infra
        env:
          AWS_REGION: us-east-1
          PULUMI_CONFIG_PASSPHRASE: ""
        run: |
          AWS_REGION=us-east-1 pulumi login s3://brevly-pulumi-state
          DB_ENDPOINT=$(AWS_REGION=us-east-1 pulumi stack output databaseEndpoint -s brevly-prod)
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> "$GITHUB_ENV"
          PRIVATE_SUBNETS=$(AWS_REGION=us-east-1 pulumi stack output privateSubnetIds -s brevly-prod --json | python3 -c "import sys,json;print(','.join(json.load(sys.stdin)))")
          echo "PRIVATE_SUBNETS=$PRIVATE_SUBNETS" >> "$GITHUB_ENV"
          TASK_DEF=$(aws ecs list-task-definitions --region us-east-1 --family-prefix brevly-server --sort DESC --query 'taskDefinitionArns[0]' --output text)
          echo "TASK_DEF=$TASK_DEF" >> "$GITHUB_ENV"
          if [ -z "$DB_ENDPOINT" ] || [ -z "$TASK_DEF" ]; then echo "::error::output vazio" && exit 1; fi

      - name: Run migrations via ECS one-off task
        env:
          AWS_REGION: us-east-1
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TASK_DEF: ${{ env.TASK_DEF }}
          DB_ENDPOINT: ${{ env.DB_ENDPOINT }}
          PRIVATE_SUBNETS: ${{ env.PRIVATE_SUBNETS }}
        run: |
          cat > /tmp/overrides.json <<EOF
          {"containerOverrides":[{"name":"brevly-server","command":["node","-e","const{drizzle}=require('drizzle-orm/node-postgres');const{migrate}=require('drizzle-orm/node-postgres/migrator');const{Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});const db=drizzle(p);migrate(db,{migrationsFolder:'/app/drizzle'}).then(()=>process.exit(0)).catch(e=>{console.error('MIGRATE_ERRO:',e.message);process.exit(1)})"],"environment":[{"name":"DATABASE_URL","value":"postgres://postgres:$DB_PASSWORD@$DB_ENDPOINT/brevly?sslmode=no-verify"},{"name":"NODE_ENV","value":"production"}]}]}
          EOF
          TASK_ARN=$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster brevly-cluster \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF" \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNETS]}" \
            --overrides file:///tmp/overrides.json \
            --query 'tasks[0].taskArn' --output text)
          echo "migrate task: $TASK_ARN"
          aws ecs wait tasks-stopped --region "$AWS_REGION" --cluster brevly-cluster --tasks "$TASK_ARN"
          EXIT=$(aws ecs describe-tasks --region "$AWS_REGION" --cluster brevly-cluster --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate exit code: $EXIT"
          if [ "$EXIT" != "0" ]; then exit 1; fi

  deploy-web:
    name: Deploy web (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: pulumi-deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v4
        name: Setup Node.js
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install dependencies
        working-directory: infra
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        env:
          VITE_BACKEND_URL: https://api.brev-ly.burndev.app
          VITE_FRONTEND_URL: https://brev-ly.burndev.app
        run: pnpm build

      - name: Sync to S3
        run: aws s3 sync web/dist/ "s3://$S3_BUCKET" --delete

      - name: Invalidate CloudFront
        working-directory: infra
        env:
          AWS_REGION: us-east-1
          PULUMI_CONFIG_PASSPHRASE: ""
        run: |
          AWS_REGION=us-east-1 pulumi login s3://brevly-pulumi-state
          DISTRIBUTION_ID=$(AWS_REGION=us-east-1 pulumi stack output cdnDistributionId -s brevly-prod)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"